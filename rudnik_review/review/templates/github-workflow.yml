# A pull request with a new blocking finding fails. @main is the latest release; hold one by its v<version> tag.
name: rudnik-review
on: pull_request
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the merge base needs history
      - uses: ivansttt/rudnik-review@main
