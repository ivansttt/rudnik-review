rules:
  - id: sql-test-selects-private-attribute
    metadata: {"rule": "sql-test-selects-private-attribute", "evidence": ["https://github.com/apache/superset/pull/40778#discussion_r3383430567", "https://github.com/apache/superset/pull/40778#discussion_r3383430573"]}
    languages:
      - javascript
      - typescript
    message: >-
      Test locates an element via an internal/private UI-library attribute
      (data-icon) rather than an accessible role/label or data-testid. Prefer
      getByRole/getByLabelText or add a data-testid so an upstream library
      change cannot silently break the test.
    severity: WARNING
    patterns:
      - pattern: $ELEMENT.querySelector($SELECTOR)
      - metavariable-regex:
          metavariable: $SELECTOR
          regex: .*data-icon.*
