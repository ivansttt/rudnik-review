rules:
  - id: java-redundant-cast
    metadata: {"rule": "java-redundant-cast", "evidence": ["https://github.com/apache/kafka/pull/22788#discussion_r3626412042", "https://github.com/apache/kafka/pull/22788#discussion_r3626417837", "https://github.com/apache/kafka/pull/22788#discussion_r3626418195", "https://github.com/apache/lucene/pull/13702#discussion_r1739456526"]}
    languages:
      - java
    message: Redundant cast to a supertype or interface the value already satisfies
    severity: WARNING
    pattern-either:
      - pattern: ($T) new $C(...)
      - pattern: ($T) $R.$M(...)
