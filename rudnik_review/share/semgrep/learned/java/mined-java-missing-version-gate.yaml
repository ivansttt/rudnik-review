rules:
  - id: java-missing-version-gate
    metadata: {"rule": "java-missing-version-gate", "evidence": ["https://github.com/apache/kafka/pull/22551#discussion_r3415129405", "https://github.com/apache/kafka/pull/22461#discussion_r3380988334"]}
    languages:
      - java
      - python
    message: Version-gated feature or field used without checking the version
    severity: WARNING
    pattern-regex: 'maybeSetTopologyDescriptionRequired\(result, request\.groupId\(\)\)|if self\.close_timeout_sec >= 0:'