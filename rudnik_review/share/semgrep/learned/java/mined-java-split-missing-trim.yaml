rules:
  - id: java-split-missing-trim
    metadata: {"rule": "java-split-missing-trim", "evidence": ["https://github.com/apache/kafka/pull/22213#discussion_r3574978419"]}
    languages:
      - java
    message: Delimited value split without trimming surrounding whitespace
    severity: WARNING
    patterns:
      - pattern: $X.split($DELIM, ...)
      - metavariable-regex:
          metavariable: $DELIM
          regex: '^"?[,;|:]"?$'
