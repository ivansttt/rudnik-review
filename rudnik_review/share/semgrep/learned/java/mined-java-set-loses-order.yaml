rules:
  - id: java-set-loses-order
    metadata: {"rule": "java-set-loses-order", "evidence": ["https://github.com/apache/kafka/pull/22920#discussion_r3648586909"]}
    languages: [java]
    severity: WARNING
    message: Collecting an ordered list into a Set drops ordering that may be meaningful.
    pattern: $X.stream().map($F).collect(java.util.stream.Collectors.toSet())
