rules:
  - id: java-null-message-concat
    metadata: {"rule": "java-null-message-concat", "evidence": ["https://github.com/apache/kafka/pull/22607#discussion_r3448448695"]}
    languages: [java]
    severity: WARNING
    message: "getMessage() may return null; guard before concatenating"
    pattern-either:
      - pattern: "$X.getMessage() + $S"
      - pattern: "$S + $X.getMessage()"
