rules:
  - id: php-dynamic-property-assignment
    metadata: {"rule": "php-dynamic-property-assignment", "evidence": ["https://github.com/laravel/framework/pull/53731#discussion_r1866778989"]}
    languages:
      - php
    severity: WARNING
    message: Assignment to an undeclared property creates a dynamic property
    pattern: $this->$PROP = $VALUE;
