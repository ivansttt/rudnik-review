rules:
  - id: python-import-inside-loop
    metadata: {"rule": "python-import-inside-loop", "evidence": ["https://github.com/pypa/pip/pull/14054#discussion_r3409521347"]}
    languages: [python]
    message: "Import inside a loop re-executes on every iteration; hoist it above the loop."
    severity: INFO
    pattern-either:
      - pattern: |
          for $X in $ITER:
            ...
            import $M
            ...
      - pattern: |
          for $X in $ITER:
            ...
            from $MOD import $N
            ...
      - pattern: |
          for $X in $ITER:
            ...
            from $MOD import $N as $ALIAS
            ...
      - pattern: |
          while $COND:
            ...
            import $M
            ...
      - pattern: |
          while $COND:
            ...
            from $MOD import $N
            ...
      - pattern: |
          while $COND:
            ...
            from $MOD import $N as $ALIAS
            ...
