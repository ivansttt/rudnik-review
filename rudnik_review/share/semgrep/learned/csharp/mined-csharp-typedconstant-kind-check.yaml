rules:
  - id: csharp-typedconstant-kind-check
    metadata: {"rule": "csharp-typedconstant-kind-check", "evidence": ["https://github.com/dotnet/aspnetcore/pull/66646#discussion_r3233132489", "https://github.com/dotnet/aspnetcore/pull/66646#discussion_r3233136715"]}
    languages: [csharp]
    severity: WARNING
    message: Check a TypedConstant's Kind before reading its Value; accessing Value on an unexpected kind (array, type, enum) throws.
    patterns:
      - pattern: $X.Value.Value
      - pattern-not-inside: |
          if ($COND && $X.Value.Kind == $K)
          {
            ...
          }
