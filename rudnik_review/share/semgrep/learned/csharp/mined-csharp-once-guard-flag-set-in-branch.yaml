rules:
  - id: csharp-once-guard-flag-set-in-branch
    metadata: {"rule": "csharp-once-guard-flag-set-in-branch", "evidence": ["https://github.com/dotnet/aspnetcore/pull/66753#discussion_r3275527610"]}
    languages:
      - csharp
    severity: WARNING
    message: Set the one-shot guard flag unconditionally, not inside the branch it guards.
    patterns:
      - pattern-either:
          - pattern: |
              if (!$FLAG && ... && $X > $N && ...)
              {
                  $FLAG = true;
                  ...
                  await $FUNC($X);
              }
          - pattern: |
              if (!$FLAG && ... && $X > $N && ...)
              {
                  $FLAG = true;
                  ...
                  $FUNC($X);
              }
