# Import cycles (spec 1650, 11 Nov 2026): a cycle runs through modules a one-file linter never reads together, so pylint is a whole tool,
# reading every tracked *.py, with every checker off but cyclic-import: it adds no rule ruff already has. Blocks nothing until spec 1626
# measures it; a cycle that was on main blocks nobody (spec 1237).
[[tool]]
name = "pylint"
version = "4.1.3"
stacks = ["python"]
globs = ["*.py"]
whole = true
cmd = ["pylint", "--disable=all", "--enable=cyclic-import", "--output-format=json", "{files}"]
adapter = "pylint"
blocks = []
