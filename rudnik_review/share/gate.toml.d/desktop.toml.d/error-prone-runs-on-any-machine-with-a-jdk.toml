# Spec 1871: Error Prone (with NullAway) on the developer's own javac, as the agent-jvm image runs it (17 Nov 2026: the owner's macOS
# arm64 trial said "error-prone: cannot be installed"). It is jars that run inside javac: setup keeps those the image takes from Maven
# Central in <tools>/error-prone, each by its URL and its sha256 from repo1.maven.org on 17 Nov 2026 (dataflow-errorprone's 18 Nov), and links error-prone and javac-ep
# to share/agent-jvm/analyse, which compiles with the project's own build forking javac-ep. javac must be the image's JDK release or later.
[desktop.error-prone]
needs = ["java", "javac"]
builds = true   # 1880: the tree's own mvn or gradle, which check finds or names
link = "share/agent-jvm/analyse"
aliases = ["javac-ep"]
platforms = ["linux/x86_64", "linux/arm64", "darwin/x86_64", "darwin/arm64"]

[desktop.error-prone.central]
