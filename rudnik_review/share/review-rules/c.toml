stObj:\n+            with open(self.testcase_dir / testObj[\"input\"], encoding=\"utf8\") as f:\n+                inputData = f.read()\n+\n+        # Read the expected output data (if there is any)\n+        outputFn = None\n+        outputData = None\n+        outputType = None\n+        if \"output_cmp\" in testObj:\n+            outputFn = testObj['output_cmp']\n+            outputType = os.path.splitext(outputFn)[1][1:]  # output type from file extension (determines how to compare)\n+            try:\n+                with open(self.testcase_dir / outputFn, encoding=\"utf8\") as f:\n+                    outputData = f.read()\n+            except Exception:\n+                logging.error(\"Output file \" + outputFn + \" cannot be opened\")\n+                raise\n+            if not outputData:\n+                logging.error(\"Output data missing for \" + outputFn)\n+                raise Exception", "@@ -61,12 +61,8 @@ class ToolUtils(BitcoinTestFramework):\n         if \"output_cmp\" in testObj:\n             outputFn = testObj['output_cmp']\n             outputType = os.path.splitext(outputFn)[1][1:]  # output type from file extension (determines how to compare)\n+            with open(self.testcase_dir / outputFn, encoding=\"utf8\") as f:\n+                outputData = f.read()\n             if not outputData:\n                 logging.error(\"Output data missing for \" + outputFn)\n                 raise Exception\n@@ -75,11 +71,7 @@ class ToolUtils(BitcoinTestFramework):\n                 raise Exception\n \n         # Run the test\n+        res = subprocess.run(execrun, capture_output=True, text=True, input=inputData)\n \n         if outputData:\n             data_mismatch, formatting_mismatch = False, False"]
