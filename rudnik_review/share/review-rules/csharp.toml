[[rule]]
id = "csharp-gc-keepalive-safehandle"
tier = "info"
title = "Use DangerousAddRef, not GC.KeepAlive, to guard a SafeHandle's buffer from a concurrent Dispose"
look_for = "Code inside a SafeHandle-derived class calls GC.KeepAlive to protect the raw handle or its buffer while a method reads it, which only delays finalization and does not stop a Dispose call on another thread from freeing the buffer, instead of using DangerousAddRef/DangerousRelease around the raw-handle use."
stack = "csharp"
evidence = [{"url" = "https://github.com/dotnet/runtime/pull/136584#discussion_r4403285070", "fix" = "5f0fc396020e2a51c9d13b879120816a8b6c2543"}]
measured = {}
semgrep_asks = 2
proposed = "warning"

