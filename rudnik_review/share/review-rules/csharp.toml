evidence = [{"url" = "https://github.com/dotnet/runtime/pull/137127#discussion_r4506757380", "fix" = "4ad38a5d6952b815a9a2a8b74bcd0df4ec4f1cbe"}]
measured = {}
semgrep = "semgrep/learned/csharp/mined-csharp-list-capacity-loop-bound.yaml"
proposed = "error"

