[[rule]]
id = "csharp-unpublished-shared-field"
tier = "info"
title = "Publish shared fields with volatile/fences, not an unrelated accessor's fence"
look_for = "A field that is read on another thread is assigned with a plain (non-volatile, non-Interlocked) write whose visibility is claimed by a fence in an unrelated accessor or method, rather than making the field volatile or adding an explicit release/acquire fence."
