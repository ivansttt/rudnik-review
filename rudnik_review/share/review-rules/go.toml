[[rule]]
id = "go-lenient-format-parse"
tier = "info"
title = "Reject inputs outside the exact expected formats instead of leniently parsing a rewritten string"
look_for = "a value that must match a small fixed set of formats is parsed by trimming or rewriting the input and delegating to a general-purpose parser, so inputs outside that set are silently accepted."
stack = "go"
evidence = [{"url" = "https://github.com/kubernetes/kubernetes/pull/144094#discussion_r4554921534", "fix" = "7ae821d00c47f96c197737e6ddbd9d6f17173511"}]
measured = {}
semgrep = "semgrep/learned/go/mined-go-lenient-format-parse.yaml"
proposed = "warning"

[[rule]]
id = "go-queue-key-mutable-fields"
tier = "info"
title = "Keep deduplicating queue keys to the item's stable identity, not fields that change"
