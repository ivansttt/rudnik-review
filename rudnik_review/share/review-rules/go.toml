rsionedParams: paramsRuntime,\n+\t\t\tAuthorizer:      input.authorizer,\n+\t\t},\n+\t\tnamespace: admissioncel.CreateNamespaceObject(input.namespace),\n+\t}, nil\n+}\n+\n+func convertInputObject(value interface{}, defaultGVK schema.GroupVersionKind) (*unstructured.Unstructured, error) {\n+\tobject, err := convertObjectToUnstructured(value)\n+\tif err != nil {", "@@ -262,11 +266,24 @@ func resolveOperation(request *admissionv1.AdmissionRequest, object, oldObject r\n \t}\n }\n \n+func resolveOperationOptions(request *admissionv1.AdmissionRequest) (runtime.Object, error) {\n \tif request == nil {\n+\t\treturn nil, nil\n+\t}\n+\tdecoded, err := decodeRawExtension(request.Options)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tswitch options := decoded.(type) {\n+\tcase nil:\n+\t\treturn nil, nil\n+\tcase runtime.Object:\n+\t\treturn options, nil\n+\tcase map[string]interface{}:\n+\t\treturn &unstructured.Unstructured{Object: options}, nil\n+\tdefault:\n+\t\treturn nil, fmt.Errorf(\"unsupported options type %T\", decoded)\n \t}\n }\n \n func resolveDryRun(request *admissionv1.AdmissionRequest) bool {"]
