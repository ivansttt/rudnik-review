evidence = [{"url" = "https://github.com/kubernetes/kubernetes/pull/143644#discussion_r4484361833", "fix" = "6d17163bb6131644f5461d508ea8ce29391cc524"}]
measured = {}
semgrep_asks = 2
proposed = "error"

