[[rule]]
id = "python-stringified-exception-in-user-message"
tier = "info"
title = "Don't interpolate raw exception text into translated user-facing errors"
look_for = "a user-facing error or update message builds its text with str(exception) inside a translation placeholder instead of a specific error key and logging the exception"
stack = "python"
evidence = [{"url" = "https://github.com/home-assistant/core/pull/190894#discussion_r4492999782", "fix" = "a53b457e15469020ae34e80ca621919648eb5ae1"}, {"url" = "https://github.com/home-assistant/core/pull/190013#discussion_r4442816669", "fix" = "0f83db81424d46664dae32affdaddbc7e031a113"}, {"url" = "https://github.com/home-assistant/core/pull/188452#discussion_r4370842289", "fix" = "cc952d9602cef8dfe866ead81a5488dc41217a6b"}, {"url" = "https://github.com/home-assistant/core/pull/187009#discussion_r4303931057", "fix" = "72f6361b093ed96461435ccf4b38e74aa0b0ebf5"}]
measured = {}
semgrep_asks = 2
trigger = "str|translation_placeholders|translation_key|exception|error"
question = "Does this hunk build a user-facing error message by putting str(exception) into a translation_placeholders value instead of using a dedicated translation key and logging the exception?"
examples = ["@@ -51,18 +52,20 @@ def __init__(\n     async def _async_setup(self) -> None:\n         \"\"\"Set up the Minecraft Server data coordinator.\"\"\"\n \n-        # Create API instance.\n         self._api = MinecraftServer(\n             self.hass,\n             self.config_entry.data.get(CONF_TYPE, MinecraftServerType.JAVA_EDITION),\n             self.config_entry.data[CONF_ADDRESS],\n         )\n \n-        # Initialize API instance.\n         try:\n             await self._api.async_initialize()\n         except MinecraftServerAddressError as error:\n-            raise ConfigEntryNotReady(f\"Initialization failed: {error}\") from error\n+            raise ConfigEntryNotReady(\n+                translation_domain=DOMAIN,\n+                translation_key=\"init_failed\",\n+                translation_placeholders={\"error\": str(error)},", "@@ -62,9 +62,7 @@ class MinecraftServerCoordinator(DataUpdateCoordinator[MinecraftServerData]):\n             await self._api.async_initialize()\n         except MinecraftServerAddressError as error:\n             raise ConfigEntryNotReady(\n+                translation_domain=DOMAIN, translation_key=\"address_lookup_failed\"\n             ) from error\n \n     @override"]
