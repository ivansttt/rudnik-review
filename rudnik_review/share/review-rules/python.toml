[[rule]]
id = "python-timezone-z-replace-without-guard"
tier = "info"
title = "Trailing Z timezone marker replaced without checking it is a timezone"
look_for = "code unconditionally replaces a trailing 'Z' timezone marker with '+00:00' before parsing an ISO datetime, without checking the 'Z' is actually a timezone suffix, so date-only strings ending in 'Z' are corrupted"
stack = "python"
evidence = [{"url" = "https://github.com/pypa/pip/pull/13625#discussion_r2512644480", "fix" = "69a8544579b458ed6c4f425100ad091877b755d3"}]
measured = {}
trigger = "fromisoformat|replace"
question = "Does the added code call fromisoformat on a string where 'Z' is replaced by '+00:00' without first checking the 'Z' is a timezone suffix?"
examples = ["@@ -1,10 +1,24 @@\n \"\"\"For when pip wants to check the date or time.\"\"\"\n \n import datetime\n+import sys\n \n \n def today_is_later_than(year: int, month: int, day: int) -> bool:\n     today = datetime.date.today()\n     given = datetime.date(year, month, day)\n \n     return today > given\n+\n+\n+def parse_iso_datetime(isodate: str) -> datetime.datetime:\n+    \"\"\"Convert an ISO format string to a datetime.\n+\n+    Handles the format 2020-01-22T14:24:01Z (trailing Z)\n+    which is not supported by older versions of fromisoformat.\n+    \"\"\"\n+    # Python 3.11+ supports Z suffix natively in fromisoformat\n+    if sys.version_info >= (3, 11):\n+        return datetime.datetime.fromisoformat(isodate)\n+    else:\n+        return datetime.datetime.fromisoformat(isodate.replace(\"Z\", \"+00:00\"))", "@@ -21,4 +21,8 @@ def parse_iso_datetime(isodate: str) -> datetime.datetime:\n     if sys.version_info >= (3, 11):\n         return datetime.datetime.fromisoformat(isodate)\n     else:\n+        return datetime.datetime.fromisoformat(\n+            isodate.replace(\"Z\", \"+00:00\")\n+            if isodate.endswith(\"Z\") and (\"T\" in isodate or \" \" in isodate.strip())\n+            else isodate\n+        )"]
semgrep = "semgrep/learned/python/mined-python-timezone-z-replace-without-guard.yaml"

