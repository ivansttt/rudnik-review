[[rule]]
id = "java-timeout-test-unbounded"
tier = "info"
title = "Timeout test without a time bound"
look_for = "A test that asserts a timeout or error occurred but does not bound how long the call may take, so it passes even if the call blocks for the full internal timeout instead of failing fast."
stack = "java"
evidence = [{"url" = "https://github.com/apache/kafka/pull/23931#discussion_r4365068677", "fix" = "7b01be41bd57438aa9c42e542fe6656e129b5e04"}]
