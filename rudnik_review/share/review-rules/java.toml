semgrep_asks = 1
proposed = "warning"

[[rule]]
id = "java-shutdown-now-orphans"
tier = "info"
title = "shutdownNow discards queued tasks and interrupts running ones"
look_for = "An executor is shut down with shutdownNow directly or via a helper, interrupting running tasks and discarding queued ones whose futures are never completed, where the tasks must finish gracefully such as reads that must not be interrupted mid-I/O."
stack = "java"
evidence = [{"url" = "https://github.com/apache/kafka/pull/23964#discussion_r4393140595", "fix" = "ad5df57a004819108e4f2932d350a1126cb0526f"}]
measured = {}
