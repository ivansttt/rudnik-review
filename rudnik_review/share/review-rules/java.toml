[[rule]]
id = "java-fixed-iteration-test"
tier = "info"
title = "Test bounded by a fixed iteration count instead of running until completion"
look_for = "A test loops a fixed, hardcoded number of times and then asserts a result that requires all input to be processed, so the test passes even when records or work were never delivered, instead of looping until the work is complete."
