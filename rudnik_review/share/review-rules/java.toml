[[rule]]
id = "java-retry-nonretriable"
tier = "info"
title = "Retry loop retries errors that cannot succeed on retry"
look_for = "A retry/backoff loop that catches a broad exception and retries without first filtering out errors that will not go away on retry (invalid input, authorization, unsupported version), so permanent failures are retried until the attempt limit."
stack = "java"
evidence = [{"url" = "https://github.com/apache/kafka/pull/24110#discussion_r4481003707", "fix" = "79807b6874322853df95bc6b865e2881b7258fee"}, {"url" = "https://github.com/apache/kafka/pull/23708#discussion_r4251960639", "fix" = "85b1c4ed10fe57aba44f1b375bd297873b4d6405"}]
measured = {}
semgrep_asks = 2
proposed = "warning"

[[rule]]
id = "java-snapshot-race"
tier = "info"
title = "Decision and action read different snapshots of mutable state"
look_for = "A branch decides on a snapshot of mutable state it captured earlier, then the branch body re-reads that same mutable state directly or through a called method instead of using the captured snapshot, so the decision and the action can observe different states."
stack = "java"
evidence = [{"url" = "https://github.com/apache/kafka/pull/24028#discussion_r4445644055", "fix" = "a8264b817b56c768488493a9034d40b7864259ec"}, {"url" = "https://github.com/apache/kafka/pull/21377#discussion_r2746708234", "fix" = "3611550301d689f033e1eab749c68550cc55292b"}, {"url" = "https://github.com/apache/kafka/pull/21091#discussion_r2594296477", "fix" = "e9a60911decbb7a7d685423f263e22a97243c6e4"}]
measured = {}
semgrep_asks = 2
trigger = "isEmpty|first|get|size"
question = "Does this expression check a mutable collection's size or emptiness and then re-read that collection for the value, instead of using one iterator snapshot?"
examples = ["@@ -148,8 +154,15 @@ private void registerMetrics() {\n         e2eLatencySensor = StateStoreMetrics.e2ELatencySensor(taskId.toString(), metricsScope, name(), streamsMetrics);\n         iteratorDurationSensor = StateStoreMetrics.iteratorDurationSensor(taskId.toString(), metricsScope, name(), streamsMetrics);\n         StateStoreMetrics.addNumOpenIteratorsGauge(taskId.toString(), metricsScope, name(), streamsMetrics,\n-                (config, now) -> openIterators.sum());\n-        openIterators = new OpenIterators(taskId, metricsScope, name(), streamsMetrics);\n+                (config, now) -> numOpenIterators.sum());\n+        StateStoreMetrics.addOldestOpenIteratorGauge(taskId.toString(), metricsScope, name(), streamsMetrics,\n+            (config, now) -> {\n+                try {\n+                    return openIterators.isEmpty() ? 0L : openIterators.first().startTimestamp();", "@@ -157,11 +157,8 @@ public class MeteredKeyValueStore<K, V>\n                 (config, now) -> numOpenIterators.sum());\n         StateStoreMetrics.addOldestOpenIteratorGauge(taskId.toString(), metricsScope, name(), streamsMetrics,\n             (config, now) -> {\n+                final Iterator<MeteredIterator> iter = openIterators.iterator();\n+                return iter.hasNext() ? iter.next().startTimestamp() : 0L;\n             });\n     }\n "]
proposed = "error"

