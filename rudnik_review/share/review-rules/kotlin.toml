stack = "kotlin"
evidence = [{"url" = "https://github.com/Kotlin/kotlinx.coroutines/pull/4700#discussion_r3602738374", "fix" = "aa8117b7764a46f6056d89173ece78b0080ef659"}]
measured = {}
trigger = "toIntOrNull|toLongOrNull|toDoubleOrNull|parse|substring|version"
question = "Does the code return a default on parse or validation failure that is wrong for realistic inputs?"
examples = ["@@ -66,4 +66,13 @@ class MavenPublicationMetaInfValidator {\n \n     private val kotlinVersion: String\n         get() = System.getProperty(\"kotlin.version.integration\")\n+\n+    private fun kotlin24OrNewer(version: String): Boolean {\n+        val majorVersion = version.substringBefore('.').toIntOrNull() ?: return false\n+        if (majorVersion > 2) return true\n+        if (majorVersion < 2) return false\n+\n+        val minorVersion = version.substringAfter('.').substringBefore('.').toIntOrNull() ?: return false\n+        return minorVersion >= 4\n+    }", "@@ -66,13 +66,4 @@ class MavenPublicationMetaInfValidator {\n \n     private val kotlinVersion: String\n         get() = System.getProperty(\"kotlin.version.integration\")\n }"]
semgrep = "semgrep/learned/kotlin/mined-kotlin-misleading-parse-fallback.yaml"
semgrep_asks = 1
proposed = "warning"

