# rudnik-review's wheel (spec 1255). bin/review-release stages it from a green main as the kit's tree in small: rudnik_review/review/cli.py
# beside rudnik_review/lib/core/{analyze,findings}.py and rudnik_review/share/gate.toml{,.d/*.toml}, and stamps the version. uv's own
# backend builds it with no download (the gate has no network). No dependency: the standard library and the registry are all it needs.
[project]
name = "rudnik-review"
version = "0.1.23125"
description = "Code review on a developer's machine: the analysers and a second-model LLM review"
readme = "README.md"   # review/root/'s, staged beside this file as the release repository's root holds them (bin/review-release)
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "rudnik"}]
urls = {Repository = "https://github.com/ivansttt/rudnik-review"}
requires-python = ">=3.11.4"

[project.scripts]
rudnik-review = "rudnik_review.review.cli:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rudnik_review"
module-root = ""
namespace = true
